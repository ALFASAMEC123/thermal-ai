version: '3.8'

services:
  # Ollama služba s GPU podporou
  ollama:
    image: ollama/ollama:latest
    container_name: thermal-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Hlavná aplikácia
  thermal-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thermal-ai
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config:/app/config
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["--check-ollama"]  # Test pripojenia pri štarte

  # Voliteľné: Jupyter pre experimentovanie
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thermal-jupyter
    depends_on:
      - ollama
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./scripts:/app/scripts
      - ./notebooks:/app/notebooks
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: >
      bash -c "pip install jupyterlab && jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''"

volumes:
  ollama_data: