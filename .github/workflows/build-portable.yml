name: Build Portable Windows Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  MODEL_NAME: "llava:7b"
  OLLAMA_VERSION: "0.3.14"
  PYTHON_VERSION: "3.11"

jobs:
  build-portable:
    name: Build Portable Bundle
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          choco install -y 7zip.install --no-progress
        shell: pwsh

      - name: Download Ollama Windows binary
        id: ollama
        run: |
          $ollamaUrl = "https://github.com/ollama/ollama/releases/download/v${{ env.OLLAMA_VERSION }}/ollama-windows-amd64.zip"
          $ollamaZip = "ollama-windows-amd64.zip"
          Write-Host "Downloading Ollama from $ollamaUrl"
          Invoke-WebRequest -Uri $ollamaUrl -OutFile $ollamaZip -UseBasicParsing
          Write-Host "Extracting Ollama..."
          7z x $ollamaZip -oollama-bin -y
          $exe = "ollama-bin\ollama.exe"
          if (Test-Path $exe) {
            Write-Host "Ollama binary found: $exe"
            & $exe --version
          } else {
            Write-Error "Ollama binary not found after extraction"
            exit 1
          }
        shell: pwsh

      - name: Pull vision model via Ollama (no auth needed)
        run: |
          Write-Host "Starting Ollama server..."
          $ollamaExe = "ollama-bin\ollama.exe"
          Start-Process -FilePath $ollamaExe -ArgumentList "serve" -WindowStyle Hidden
          Start-Sleep -Seconds 10
          
          Write-Host "Pulling model: ${{ env.MODEL_NAME }}"
          & $ollamaExe pull ${{ env.MODEL_NAME }}
          
          Write-Host "Verifying model..."
          & $ollamaExe list
          
          taskkill /F /IM ollama.exe 2>$null
          Start-Sleep -Seconds 3
        shell: pwsh
        timeout-minutes: 30

      - name: Copy Ollama model data to bundle structure
        run: |
          $userModels = "$env:USERPROFILE\.ollama\models"
          $bundleModels = "ollama-bin\models"
          if (Test-Path $userModels) {
            Copy-Item $userModels $bundleModels -Recurse -Force
            Write-Host "Copied Ollama models to bundle"
          } else {
            Write-Warning "Ollama models not found at $userModels"
          }
        shell: pwsh

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller
        shell: pwsh

      - name: Build thermal-ai.exe with PyInstaller
        run: |
          pyinstaller --clean thermal-ai.spec
        shell: pwsh
        timeout-minutes: 15

      - name: Create portable bundle
        id: bundle
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -eq "") { $version = "dev-$(Get-Date -Format 'yyyyMMdd-HHmm')" }
          $bundleName = "thermal-ai-portable-${version}"
          $bundleDir = $bundleName
          Write-Host "Creating bundle: $bundleDir"
          
          New-Item -ItemType Directory -Path "$bundleDir\ollama" -Force | Out-Null
          New-Item -ItemType Directory -Path "$bundleDir\config" -Force | Out-Null
          New-Item -ItemType Directory -Path "$bundleDir\data\raw" -Force | Out-Null
          New-Item -ItemType Directory -Path "$bundleDir\data\output" -Force | Out-Null
          
          Copy-Item "dist\thermal-ai.exe" "$bundleDir\thermal-ai.exe" -Force
          Copy-Item "ollama-bin\ollama.exe" "$bundleDir\ollama\ollama.exe" -Force
          
          $srcModels = "ollama-bin\models"
          $dstModels = "$bundleDir\ollama\models"
          if (Test-Path $srcModels) {
            Copy-Item $srcModels $dstModels -Recurse -Force
            Write-Host "Model data copied to bundle"
          }
          
          Copy-Item "config\settings.yaml" "$bundleDir\config\settings.yaml" -Force
          
          @"
          @echo off
          setlocal enabledelayedexpansion
          set "BUNDLE_DIR=%~dp0"
          cd /d "%BUNDLE_DIR%"
          set "OLLAMA_MODELS=%BUNDLE_DIR%\ollama\models"
          set "OLLAMA_HOST=127.0.0.1:11434"
          echo Starting Ollama server...
          start /B "" "%BUNDLE_DIR%\ollama\ollama.exe" serve
          echo Waiting for Ollama to start...
          :wait
          timeout /t 2 /nobreak >nul
          curl -s http://%OLLAMA_HOST%/api/tags >nul 2>&1
          if errorlevel 1 goto wait
          
          echo Registering vision model...
          "%BUNDLE_DIR%\ollama\ollama.exe" create llava:7b -f "%BUNDLE_DIR%\ollama\models\manifests\registry.ollama.ai\library\llava\7b\Modelfile" >nul 2>&1
          
          curl -s http://%OLLAMA_HOST%/api/tags | findstr /i "llava" >nul
          if errorlevel 1 (
              echo WARNING: Model registration may have failed
          ) else (
              echo Model llava:7b ready!
          )
          
          echo.
          echo ========================================
          echo  Thermal AI - Portable Bundle
          echo ========================================
          echo.
          
          if "%~1"=="" (
              echo Usage: start.bat <input> [-o output] [options]
              echo Example: start.bat data\raw\image.irb -o data\output
              echo.
              "%BUNDLE_DIR%\thermal-ai.exe" --help
          ) else (
              "%BUNDLE_DIR%\thermal-ai.exe" %*
          )
          
          if errorlevel 1 pause
          "@
          | Out-File -Encoding ASCII "$bundleDir\start.bat"
          
          @"
          @echo off
          echo Stopping Ollama server...
          taskkill /F /IM ollama.exe >nul 2>&1
          echo Done.
          "@
          | Out-File -Encoding ASCII "$bundleDir\stop.bat"
          
          @"
          Thermal AI - Portable Windows Bundle
          ======================================
          Version: ${version}
          Built: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
          QUICK START:
          1. Extract ZIP
          2. Put .irb/.raw in data\raw\
          3. Double-click start.bat
          EXAMPLES:
            start.bat data\raw\image.irb -o data\output
            start.bat data\raw\ -o data\output --recursive
          REQUIREMENTS:
            - Windows 10/11 64-bit
            - GPU 6+ GB VRAM (2-4 sec/img) or CPU fallback
            - 8+ GB RAM
            - NO INTERNET REQUIRED
          MODEL: LLaVA 7B (~4.5 GB)
          "@
          | Out-File -Encoding UTF8 "$bundleDir\README.txt"
          
          Get-ChildItem $bundleDir -Recurse | Select-Object Name, Length, FullName | Format-Table -AutoSize | Out-Host
          $totalSize = (Get-ChildItem $bundleDir -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $totalGB = [math]::Round($totalSize / 1GB, 2)
          Write-Host "Total bundle size: $totalGB GB"
          
          echo "BUNDLE_DIR=$bundleDir" >> $env:GITHUB_OUTPUT
          echo "BUNDLE_NAME=$bundleName" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create ZIP archive
        run: |
          $bundleDir = "${{ steps.bundle.outputs.BUNDLE_DIR }}"
          $bundleName = "${{ steps.bundle.outputs.BUNDLE_NAME }}"
          $zipName = "$bundleName.zip"
          Write-Host "Creating ZIP: $zipName"
          7z a -tzip "$zipName" "$bundleDir\*" -mx=1
          $zipSize = (Get-Item $zipName).Length
          $zipGB = [math]::Round($zipSize / 1GB, 2)
          Write-Host "ZIP created: $zipName ($zipGB GB)"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload portable bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.BUNDLE_NAME }}
          path: ${{ steps.bundle.outputs.BUNDLE_NAME }}.zip
          retention-days: 90
          compression-level: 0

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.bundle.outputs.BUNDLE_NAME }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
